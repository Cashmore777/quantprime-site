<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Prime | Links</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafaf8;
            --surface: #ffffff;
            --surface-dim: #f2f1ed;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-muted: #9a9a9a;
            --gold: #b8962e;
            --gold-soft: #d4b94e;
            --gold-bg: #faf6eb;
            --cyan: #0088cc;
            --green: #16a34a;
            --border: #e8e6e0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.03);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 12px;
        }

        .logo-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--text);
        }

        .logo-text span {
            color: var(--gold);
        }

        .name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            color: var(--text);
        }

        .tagline {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            text-align: center;
        }

        /* Links */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .link:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .link:active {
            transform: translateY(0);
        }

        /* Primary CTA */
        .link.primary {
            background: var(--gold);
            border: none;
            color: #fff;
            font-weight: 600;
            box-shadow: var(--shadow-md);
        }

        .link.primary:hover {
            background: #a6851f;
            box-shadow: 0 6px 20px rgba(184, 150, 46, 0.25);
        }

        /* Secondary highlight */
        .link.highlight {
            border-color: var(--gold);
            background: var(--gold-bg);
        }

        /* Discord */
        .link.discord {
            background: #5865F2;
            border: none;
            color: #fff;
        }

        .link.discord:hover {
            background: #4752c4;
        }

        /* Icons */
        .link svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .link.discord svg {
            fill: currentColor;
        }

        /* Badge */
        .badge {
            display: inline-block;
            background: var(--green);
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Divider */
        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .footer a {
            color: var(--gold);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Stats row */
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            width: 100%;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
