<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6c970"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#9a7b3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#08080c"/>
  <rect x="4" y="4" width="172" height="172" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Stylized QP Logo -->
  <g transform="translate(30, 35)">
    <!-- Q circle -->
    <circle cx="45" cy="50" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
    <!-- Q tail -->
    <line x1="65" y1="70" x2="95" y2="100" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- P shape -->
    <g opacity="0.8">
      <line x1="85" y1="30" x2="85" y2="95" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
      <path d="M85 30 Q120 30 120 50 Q120 70 85 70" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
