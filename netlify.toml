[build]
  publish = "."

# Pretty URLs - serve .html files without extension
[[redirects]]
  from = "/framework"
  to = "/framework.html"
  status = 200

[[redirects]]
  from = "/compounding"
  to = "/compounding.html"
  status = 200

[[redirects]]
  from = "/results"
  to = "/results.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

# Headers for caching
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
