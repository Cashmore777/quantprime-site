<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login — Quant Prime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #d4b85a;
  --gold-glow: rgba(201,168,76,0.15);
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-raised: #f5f5f5;
  --border: rgba(0,0,0,0.08);
  --text-1: #1a1a1a;
  --text-2: #666;
  --text-3: #999;
  --danger: #ef4444;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }

.auth-container {
  width: 100%;
  max-width: 420px;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 40px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-1);
  text-decoration: none;
}

.brand span { color: var(--gold); }

.brand-ring {
  width: 40px;
  height: 40px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  background: linear-gradient(135deg, var(--gold-glow), transparent);
}

.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}

.auth-card h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}

.auth-card .subtitle {
  font-size: 14px;
  color: var(--text-2);
  text-align: center;
  margin-bottom: 32px;
}

.form-row {
  margin-bottom: 20px;
}

.form-row label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 8px;
}

.form-row input {
  width: 100%;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 15px;
  color: var(--text-1);
  font-family: var(--sans);
  outline: none;
  transition: all 0.2s;
}

.form-row input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-glow);
}

.form-row input.error {
  border-color: var(--danger);
}

.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 48px;
}

.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-3);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.password-toggle:hover {
  color: var(--text-1);
}

.password-toggle svg {
  width: 20px;
  height: 20px;
}

.error-message {
  display: none;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--danger);
  margin-bottom: 20px;
}

.error-message.show { display: block; }

.btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #000;
  font-weight: 600;
  font-size: 15px;
  padding: 16px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 12px rgba(201,168,76,0.25);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(201,168,76,0.35);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 28px 0;
  font-size: 12px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.alt-link {
  text-align: center;
  font-size: 14px;
  color: var(--text-2);
}

.forgot-link {
  display: block;
  text-align: right;
  font-size: 13px;
  margin-top: 8px;
  margin-bottom: 24px;
}

.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0,0,0,0.2);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="auth-container">
  <a href="/" class="brand">
    
    QUANT<span>PRIME</span>
  </a>
  
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your Quant Prime account</p>
    
    <div class="error-message" id="error-message"></div>
    
    <form id="login-form">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      
      <div class="form-row">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      
      <a href="#" class="forgot-link">Forgot password?</a>
      
      <button type="submit" class="btn" id="submit-btn">
        Sign in
      </button>
    </form>
    
    <div class="divider">or</div>
    
    <p class="alt-link">
      Don't have an account? <a href="/dashboard/register.html">Create one</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pjqwnqhnuxwinwxdritp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqcXducWhudXh3aW53eGRyaXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjY4NDIsImV4cCI6MjEwMDUwMjg0Mn0.F2Jc11_uEEJ7DAI6SHKu0EyyjlX0UUDmVznU-EO9BsQ';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Check if already logged in
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    window.location.href = '/dashboard/';
  }
});

const form = document.getElementById('login-form');
const errorEl = document.getElementById('error-message');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  // Reset state
  errorEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="loading-spinner"></span>Signing in...';
  
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });
    
    if (error) throw error;
    
    // Success - redirect to dashboard
    window.location.href = '/dashboard/';
    
  } catch (error) {
    errorEl.textContent = error.message || 'Failed to sign in. Please try again.';
    errorEl.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Sign in';
  }
});

// Toggle password visibility
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  
  // Update icon
  btn.innerHTML = isPassword 
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>`;
}
</script>

</body>
</html>
